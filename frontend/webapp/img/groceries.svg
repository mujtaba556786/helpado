<!-- Groceries: a shopping bag with produce. Was sap-icon://basket — closest of
     the five, but abstract; a bag with a leaf reads as food shopping. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Groceries">
    <g fill="#2E8B57">
        <!-- handles -->
        <path d="M23 24v-4a9 9 0 0 1 18 0v4h-6v-4a3 3 0 0 0-6 0v4z"/>
        <!-- bag -->
        <path d="M14 22h36l3.4 32a5 5 0 0 1-5 5.5H15.6a5 5 0 0 1-5-5.5z"/>
    </g>
    <!-- leaf, so it reads as food rather than retail -->
    <path d="M32 34c-7 0-11 4-11 10 7 .6 11-3 11-10z" fill="#FFFFFF"/>
    <path d="M33 34c0 7 4 10.6 11 10 0-6-4-10-11-10z" fill="#FFFFFF" opacity="0.75"/>
</svg>
