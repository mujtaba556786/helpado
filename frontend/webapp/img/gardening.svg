    <g fill="#2E8B57">
        <!-- leaves -->
        <path d="M30 30c-12 0-19-6-19-15 11-2 19 3 19 15z"/>
        <path d="M34 30c0-13 8-18 19-16-1 10-8 16-19 16z"/>
        <!-- stem -->
        <rect x="30" y="26" width="4" height="14" rx="2"/>
        <!-- pot -->
        <path d="M16 40h32l-3.5 16a3 3 0 0 1-3 2.4H22.5a3 3 0 0 1-3-2.4z"/>
    </g>
    <rect x="16" y="40" width="32" height="5" fill="#FFFFFF" opacity="0.85"/>
</svg>
