<!-- Gardening: potted plant. Was sap-icon://tree, which in SAP's font is an
     ORG CHART (boxes and connectors), not a plant. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="7 11 50 50" width="14" height="14" role="img" aria-label="Gardening">
    <defs>
        <!-- Details are cut OUT so the tile background shows through, like the
             counters in SAP icon-font glyphs. Painted white on top they broke on
             hover, when the SAP glyphs turn white. -->
        <mask id="cut" maskUnits="userSpaceOnUse" x="-64" y="-64" width="192" height="192">
            <rect x="-64" y="-64" width="192" height="192" fill="#fff"/>
            <!-- pot rim -->
            <rect x="16" y="40" width="32" height="5" fill="#000"/>
        </mask>
    </defs>
    <g fill="#10b981" mask="url(#cut)">
        <!-- leaves -->
        <path d="M30 30c-12 0-19-6-19-15 11-2 19 3 19 15z"/>
        <path d="M34 30c0-13 8-18 19-16-1 10-8 16-19 16z"/>
        <!-- stem -->
        <rect x="30" y="26" width="4" height="14" rx="2"/>
        <!-- pot -->
        <path d="M16 40h32l-3.5 16a3 3 0 0 1-3 2.4H22.5a3 3 0 0 1-3-2.4z"/>
    </g>
</svg>
