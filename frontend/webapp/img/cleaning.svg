<!-- Cleaning: bucket with suds. Was sap-icon://home-share — a house with a
     share arrow. Two spray-bottle attempts read as a blob and then as a tube at
     26px; a bucket is fewer, bolder shapes and survives the tile size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cleaning">
    <g fill="#2E8B57">
        <!-- suds -->
        <circle cx="46" cy="10" r="5"/>
        <circle cx="56" cy="18" r="3.4"/>
        <circle cx="37" cy="16" r="2.8"/>
        <!-- handle -->
        <path d="M14 30a18 18 0 0 1 36 0h-6a12 12 0 0 0-24 0z"/>
        <!-- bucket -->
        <path d="M8 30h48l-5.4 25.6A6 6 0 0 1 44.7 60H19.3a6 6 0 0 1-5.9-4.4z"/>
    </g>
    <!-- rim highlight -->
    <rect x="8" y="30" width="48" height="5" rx="2.5" fill="#FFFFFF" opacity="0.9"/>
</svg>
