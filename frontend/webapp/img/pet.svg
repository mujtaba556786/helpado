<!-- Pet Care tile mark. SAP's icon font has no animal of any kind (checked all
     704 glyphs), and the category previously used "customer" — a human figure.
     Drawn in the brand green to sit with the icon-font tiles. Features are
     deliberately large and few: this renders at 26px on the tile, where fine
     detail turns to mush. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pet Care">
    <g fill="#2E8B57">
        <!-- ears, angled outward so the silhouette reads as an animal at 26px -->
        <path d="M13 12c-3.8 0-6.1 3.4-5.5 8l2.1 14.6 12.2-12.3z"/>
        <path d="M51 12c3.8 0 6.1 3.4 5.5 8l-2.1 14.6-12.2-12.3z"/>
        <!-- head -->
        <path d="M32 17c-10.4 0-18.8 8-18.8 17.8 0 8.7 6.1 14.6 12.4 17.1 4.2 1.6 8.6 1.6 12.8 0
                 6.3-2.5 12.4-8.4 12.4-17.1C50.8 25 42.4 17 32 17z"/>
    </g>
    <g fill="#FFFFFF">
        <!-- eyes -->
        <circle cx="24" cy="33" r="3.9"/>
        <circle cx="40" cy="33" r="3.9"/>
        <!-- muzzle -->
        <ellipse cx="32" cy="45" rx="9.5" ry="6.6"/>
    </g>
    <!-- nose -->
    <ellipse cx="32" cy="42.4" rx="4" ry="3" fill="#2E8B57"/>
</svg>
