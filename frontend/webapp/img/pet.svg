<!-- Pet Care tile mark. SAP's icon font has no animal of any kind (checked all
     704 glyphs), and the category previously used "customer" — a human figure.
     Features are deliberately large and few: at tile size fine detail turns
     to mush. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="4.64 5.21 54.72 54.72" width="14" height="14" role="img" aria-label="Pet Care">
    <defs>
        <!-- Details are cut OUT so the tile background shows through, like the
             counters in SAP icon-font glyphs. Painted white on top they broke on
             hover, when the SAP glyphs turn white. -->
        <mask id="cut" maskUnits="userSpaceOnUse" x="-64" y="-64" width="192" height="192">
            <rect x="-64" y="-64" width="192" height="192" fill="#fff"/>
            <!-- eyes -->
            <circle cx="24" cy="33" r="3.9" fill="#000"/>
            <circle cx="40" cy="33" r="3.9" fill="#000"/>
            <!-- muzzle -->
            <ellipse cx="32" cy="45" rx="9.5" ry="6.6" fill="#000"/>
        </mask>
    </defs>
    <g fill="#10b981" mask="url(#cut)">
        <!-- ears, angled outward so the silhouette reads as an animal -->
        <path d="M13 12c-3.8 0-6.1 3.4-5.5 8l2.1 14.6 12.2-12.3z"/>
        <path d="M51 12c3.8 0 6.1 3.4 5.5 8l-2.1 14.6-12.2-12.3z"/>
        <!-- head -->
        <path d="M32 17c-10.4 0-18.8 8-18.8 17.8 0 8.7 6.1 14.6 12.4 17.1 4.2 1.6 8.6 1.6 12.8 0
                 6.3-2.5 12.4-8.4 12.4-17.1C50.8 25 42.4 17 32 17z"/>
    </g>
    <!-- nose, inside the muzzle cut-out -->
    <ellipse cx="32" cy="42.4" rx="4" ry="3" fill="#10b981"/>
</svg>
