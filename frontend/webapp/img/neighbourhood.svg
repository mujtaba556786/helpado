<!-- No width/height on the root: an intrinsic 900px would set the flex basis of the
     login FlexBox and push the whole page into horizontal overflow on a phone.
     viewBox alone gives the aspect ratio and lets the container drive the width. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320"
     preserveAspectRatio="xMidYMax meet" role="img"
     aria-label="Illustration of a neighbourhood with houses, trees and a path">
    <defs>
        <clipPath id="hhScene"><rect width="900" height="320"/></clipPath>
    </defs>
    <g clip-path="url(#hhScene)">

        <!-- ── Sky layer: sun, skyline, clouds ─────────────────────────── -->
        <circle cx="468" cy="150" r="66" fill="#FAF0C0" opacity="0.85"/>

        <g fill="#DCEEE3">
            <rect x="384" y="128" width="44" height="104" rx="4"/>
            <rect x="436" y="158" width="34" height="74" rx="4"/>
            <rect x="478" y="142" width="40" height="90" rx="4"/>
            <rect x="526" y="170" width="30" height="62" rx="4"/>
            <rect x="564" y="120" width="38" height="112" rx="4"/>
            <rect x="610" y="152" width="32" height="80" rx="4"/>
            <rect x="650" y="136" width="26" height="96" rx="4"/>
        </g>

        <g fill="#D3EBDC">
            <ellipse cx="150" cy="92" rx="42" ry="20"/>
            <ellipse cx="182" cy="84" rx="28" ry="22"/>
            <ellipse cx="742" cy="74" rx="38" ry="18"/>
            <ellipse cx="772" cy="68" rx="26" ry="20"/>
        </g>

        <!-- ── Far tree line ───────────────────────────────────────────── -->
        <g fill="#BFE3CB">
            <circle cx="60" cy="212" r="46"/>
            <circle cx="132" cy="204" r="38"/>
            <circle cx="300" cy="208" r="42"/>
            <circle cx="600" cy="206" r="40"/>
            <circle cx="800" cy="200" r="48"/>
            <circle cx="866" cy="214" r="40"/>
        </g>

        <!-- ── Mid ground ──────────────────────────────────────────────── -->
        <path d="M0 232 Q 225 206 450 224 T 900 214 L900 320 L0 320 Z" fill="#9BD9B2"/>

        <!-- ── Houses ──────────────────────────────────────────────────── -->
        <!-- left -->
        <g>
            <path d="M150 232 L214 186 L278 232 Z" fill="#2E8B57"/>
            <rect x="166" y="230" width="96" height="60" rx="4" fill="#FBF9EF"/>
            <rect x="184" y="248" width="24" height="22" rx="3" fill="#3FA06A"/>
            <rect x="220" y="248" width="24" height="22" rx="3" fill="#3FA06A"/>
        </g>
        <!-- right -->
        <g>
            <path d="M636 236 L692 196 L748 236 Z" fill="#2E8B57"/>
            <rect x="650" y="234" width="84" height="54" rx="4" fill="#FBF9EF"/>
            <rect x="666" y="250" width="22" height="20" rx="3" fill="#3FA06A"/>
            <rect x="700" y="250" width="22" height="20" rx="3" fill="#3FA06A"/>
        </g>

        <!-- ── Trees ───────────────────────────────────────────────────── -->
        <g>
            <!-- rounded canopies -->
            <g fill="#3FA06A">
                <circle cx="96" cy="228" r="34"/>
                <circle cx="330" cy="236" r="28"/>
                <circle cx="592" cy="238" r="26"/>
                <circle cx="836" cy="230" r="32"/>
            </g>
            <g stroke="#2E8B57" stroke-width="6" stroke-linecap="round">
                <line x1="96" y1="252" x2="96" y2="288"/>
                <line x1="330" y1="258" x2="330" y2="290"/>
                <line x1="592" y1="260" x2="592" y2="290"/>
                <line x1="836" y1="254" x2="836" y2="288"/>
            </g>
            <!-- slim conical trees -->
            <g fill="#55B77E">
                <ellipse cx="288" cy="240" rx="16" ry="30"/>
                <ellipse cx="778" cy="242" rx="15" ry="28"/>
                <ellipse cx="486" cy="246" rx="14" ry="26"/>
            </g>
            <g stroke="#2E8B57" stroke-width="5" stroke-linecap="round">
                <line x1="288" y1="266" x2="288" y2="292"/>
                <line x1="778" y1="266" x2="778" y2="292"/>
                <line x1="486" y1="268" x2="486" y2="292"/>
            </g>
        </g>

        <!-- ── Foreground grass ────────────────────────────────────────── -->
        <path d="M0 274 Q 220 256 452 272 T 900 264 L900 320 L0 320 Z" fill="#7CC894"/>

        <!-- ── Winding path ────────────────────────────────────────────── -->
        <path d="M452 264
                 C 442 286 452 302 498 320
                 L 622 320
                 C 556 300 502 286 480 264 Z"
              fill="#F2EDDC"/>

        <!-- ── Foreground bushes ───────────────────────────────────────── -->
        <g fill="#2F8F5B">
            <ellipse cx="46" cy="300" rx="76" ry="40"/>
            <ellipse cx="140" cy="312" rx="58" ry="30"/>
            <ellipse cx="852" cy="298" rx="80" ry="40"/>
            <ellipse cx="742" cy="314" rx="56" ry="28"/>
        </g>
    </g>
</svg>
