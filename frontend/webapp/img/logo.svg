<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Helpado">
    <defs>
        <linearGradient id="hhTile" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#43AE71"/>
            <stop offset="1" stop-color="#1C7449"/>
        </linearGradient>
    </defs>

    <!-- Rounded app tile -->
    <rect width="512" height="512" rx="116" ry="116" fill="url(#hhTile)"/>

    <!-- House drawn as ONE white silhouette (roof + body), so the mark stays a
         single closed shape and survives 48dp on the launcher. -->
    <path d="M256 96 L444 254 a16 16 0 0 1 -10 28 L410 282 L410 400
             a20 20 0 0 1 -20 20 L122 420 a20 20 0 0 1 -20 -20 L102 282
             L78 282 a16 16 0 0 1 -10 -28 Z"
          fill="#FFFFFF"/>

    <!-- Heart knocked out of the house in the tile green -->
    <path d="M256 372
             c-58 -38 -78 -70 -56 -98
             c14 -18 41 -17 56 4
             c15 -21 42 -22 56 -4
             c22 28 2 60 -56 98 Z"
          fill="url(#hhTile)"/>
</svg>
