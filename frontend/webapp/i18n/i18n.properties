# Help & FAQ
faqFindQ=How do I find help near me?
faqFindA=Open Find Help, choose a category, and browse helpers in your neighbourhood. Tap a helper to open their profile, then Book or Message them.
faqBookQ=How do I book a helper?
faqBookA=Open the helper's profile and tap Book. Choose a date and time, then confirm. The booking appears under Schedule.
faqCostQ=What will it cost?
faqCostA=Each helper sets their own hourly rate. It is shown on their profile and again in the booking screen before you confirm.
faqTaskQ=Can I post a task instead?
faqTaskA=Yes. Tap Post Task, describe what you need, and set a budget and date. Helpers nearby can then get in touch.
faqSafetyQ=Someone is behaving badly. What can I do?
faqSafetyA=Open their profile and use Report or Block. Blocking stops them from messaging you.
faqDataQ=How is my data handled?
faqDataA=See the Privacy Policy under Legal in this menu. If anything is unclear, contact support and we will explain.
faqStillStuck=Still stuck? Send us a message and we will help.

# Trust — what we actually check
profileMemberSince=Member since {0}
profileJobsCompleted={0} jobs completed
faqChecksQ=How do you check helpers?
faqChecksA=Every account is confirmed by email — signing in requires a code we send there. We do not check ID documents, addresses or criminal records, so treat a listing as an introduction, not a guarantee. What you can rely on: ratings and reviews come only from bookings that were actually completed, and you can report or block anyone from their profile.
