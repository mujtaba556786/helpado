      { id: 'dokumente', who: 'For customers', h: '4. Certificate of conduct, qualifications, insurance', intro: 'Three documents you should see depending on the category. Helpers on Helpado have agreed to show them on request.',
        tips: [['Extended Führungszeugnis – for children and tutoring', 'The person applies themselves at the Bürgeramt or online with their ID; about €13, takes 2–4 weeks. Shows entries relevant to working with children. No older than three months.'], ['Proof for skilled trades', 'Electrical, gas and plumbing work require a registered trade business. Tutoring needs no degree, but ask about subject and grade level. Medical nursing care does not exist on Helpado – only companionship and household help.'], ['Private liability insurance', 'Covers many accidents while helping (a broken vase, a scratched floor). Ask whether they have one. Your own contents insurance often does not cover theft by people you let in – check.']] },
      { id: 'vereinbaren', who: 'For both', h: '5. Record price, time and payment', intro: 'The contract is between you, not with Helpado. Three sentences in the chat are enough so nobody has to argue later.',
        tips: [['Write in the chat: what, when, how long, how much', '“Friday 10–13, kitchen and bathroom, €16/hour, cash afterwards.” Both reply “fine”.'], ['Pay directly, with a record', 'Cash or bank transfer – Helpado keeps nothing. With a transfer the reference line is your receipt. With cash: a short confirmation in the chat.'], ['Cancel with notice', 'A day ahead is fair. Repeated short-notice cancellations earn an honest review.'], ['Regular help: registering pays off', 'Up to €556 a month you can register household help as a Minijob via the Minijob-Zentrale (Haushaltsscheck). Little effort, and you can deduct 20% of the cost from your taxes (§ 35a EStG). Ask a tax adviser if unsure.']],
        callout: ['Undeclared work is not a trivial offence', 'Regular, unregistered employment can mean fines for both sides. Occasional neighbourly help is different from the same person every week.'] },
      { id: 'helfer', who: 'For helpers', h: '6. Your safety as a helper', intro: 'You enter strangers’ homes. The same rules apply to you – plus a few more.',
        tips: [['First meeting at the door, not alone in the flat', 'If it feels wrong: decline politely. You owe no explanation.'], ['Someone knows where you are', 'Send the address and time to a friend or family. Check in after evening jobs.'], ['Price in the chat beforehand, not at the door', 'And no extra work without a new price. “While you’re here…” is a new agreement.'], ['No keys, no cards, no PINs', 'Shopping? Cash with a receipt, or the person comes along. Never accept bank cards.'], ['Offer only what you are allowed to', 'No paid passenger transport, no electrical work, no medical care. That protects you from liability.'], ['Declare your income', 'Side income is taxable; above the trade threshold you need a registration. Honest is cheaper than a back payment.']] },
      { id: 'danach', who: 'For both', h: '7. Afterwards: review, report, block', intro: 'Reviews are the only checking system Helpado has. They only work if you are honest.',
        tips: [['Review honestly, even when it is awkward', 'Three stars with a reason help the next neighbour more than five out of politeness.'], ['Report fraud, harassment, threats, false identity', 'In the app via “Report user”. We read every report, suspend clear cases immediately and report crimes to the police.'], ['Block when you want no further contact', 'The person no longer sees you and cannot message you. No explanation needed.'], ['In case of damage: photos, chat, contact', 'Settle directly first, then their liability insurance, then your own. Helpado can mediate, but not compensate.']] }
    ]
  };

        tips: [['Führungszeugnis موسّعة – للأطفال والدروس', 'يطلبها الشخص بنفسه من Bürgeramt أو عبر الإنترنت بهويته؛ نحو 13 €، وتستغرق 2–4 أسابيع. تُظهر السجلات المتعلقة بالعمل مع الأطفال. لا أقدم من ثلاثة أشهر.'], ['إثبات للأعمال المتخصصة', 'أعمال الكهرباء والغاز والسباكة تتطلب منشأة حرفية مسجلة. الدروس الخصوصية لا تحتاج شهادة، لكن اسأل عن المادة والصف. الرعاية التمريضية الطبية غير موجودة في Helpado – فقط المرافقة وأعمال المنزل.'], ['تأمين المسؤولية الخاص', 'يغطي كثيراً من الأضرار أثناء المساعدة (مزهرية مكسورة، خدش في الأرضية). اسأل إن كان موجوداً. تأمين محتويات منزلك غالباً لا يغطي السرقة من أشخاص أدخلتهم بنفسك – تحقق.']] },
      { id: 'vereinbaren', who: 'لكليكما', h: '5. سجّل السعر والوقت والدفع', intro: 'العقد بينكما وليس مع Helpado. ثلاث جمل في المحادثة تكفي كي لا يتجادل أحد لاحقاً.',
        tips: [['اكتب في المحادثة: ماذا، متى، كم من الوقت، وبكم', '«الجمعة 10–13، المطبخ والحمام، 16 € للساعة، نقداً بعد العمل.» يرد الاثنان بـ«موافق».'], ['ادفع مباشرة مع إثبات', 'نقداً أو تحويلاً – Helpado لا يقتطع شيئاً. في التحويل سطر البيان هو إيصالك. نقداً: تأكيد قصير في المحادثة.'], ['ألغِ بإشعار مسبق', 'قبل يوم أمر عادل. من يلغي مراراً في اللحظة الأخيرة ينال تقييماً صادقاً.'], ['المساعدة المنتظمة: التسجيل يستحق', 'حتى 556 € شهرياً يمكنك تسجيل المساعدة المنزلية كـMinijob عبر Minijob-Zentrale (Haushaltsscheck). الجهد قليل، ويمكنك خصم 20% من التكلفة من الضريبة (§ 35a EStG). عند الشك اسأل مستشاراً ضريبياً.']],
        callout: ['العمل غير المصرّح به ليس مخالفة بسيطة', 'التوظيف المنتظم غير المسجل قد يعني غرامات للطرفين. المساعدة الجوارية العرضية تختلف عن الشخص نفسه كل أسبوع.'] },
      { id: 'helfer', who: 'للمساعدين', h: '6. أمانك كمساعد', intro: 'أنت تدخل بيوت غرباء. القواعد نفسها تنطبق عليك – وبضع قواعد إضافية.',
        tips: [['اللقاء الأول عند الباب، لا وحدك في الشقة', 'إن شعرت بعدم الارتياح: اعتذر بلطف. لست مديناً بتفسير.'], ['أحدهم يعرف أين أنت', 'أرسل العنوان والوقت لصديق أو للعائلة. اطمئنهم بعد المواعيد المسائية.'], ['السعر مسبقاً في المحادثة، لا عند الباب', 'ولا عمل إضافي بلا سعر جديد. «ما دمت هنا…» اتفاق جديد.'], ['لا مفاتيح، لا بطاقات، لا أرقام سرية', 'تسوّق؟ نقد مع إيصال، أو يأتي الشخص معك. لا تقبل بطاقات بنكية أبداً.'], ['اعرض فقط ما يُسمح لك به', 'لا نقل ركاب بأجر، لا كهرباء، لا رعاية طبية. هذا يحميك من المسؤولية.'], ['صرّح بدخلك', 'الدخل الإضافي خاضع للضريبة؛ فوق عتبة النشاط التجاري تحتاج تسجيلاً. الصدق أرخص من دفع متأخر.']] },
      { id: 'danach', who: 'لكليكما', h: '7. بعد ذلك: قيّم، أبلغ، احظر', intro: 'التقييمات هي نظام التحقق الوحيد لدى Helpado. لا تعمل إلا إذا كنت صادقاً.',
        tips: [['قيّم بصدق حتى لو كان محرجاً', 'ثلاث نجوم مع سبب تفيد الجار التالي أكثر من خمس من باب المجاملة.'], ['أبلغ عن الاحتيال والتحرش والتهديد والهوية المزيفة', 'في التطبيق عبر «الإبلاغ عن مستخدم». نقرأ كل بلاغ، نوقف الحالات الواضحة فوراً، ونبلغ الشرطة بالجرائم.'], ['احظر إذا لم تعد تريد أي تواصل', 'لن يراك الشخص ولن يستطيع مراسلتك. لا حاجة لتفسير.'], ['عند الضرر: صور، محادثة، تواصل', 'سوِّ الأمر مباشرة أولاً، ثم تأمين مسؤولية الشخص، ثم تأمينك. Helpado يمكنه الوساطة لا التعويض.']] }
    ]
  };

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function list(items, cls) { var ul = el('ul', cls); items.forEach(function (t) { ul.appendChild(el('li', null, t)); }); return ul; }

  function render(lang) {
    var c = C[lang] || C.de, main = document.getElementById('main'); main.innerHTML = '';
    var hero = el('header', 'hero');
    hero.appendChild(el('span', 'eyebrow', c.eyebrow));
    hero.appendChild(el('h1', null, c.h1));
    hero.appendChild(el('p', 'lede', c.lede));
    var facts = el('div', 'facts');
    [['yes', c.yes], ['no', c.no]].forEach(function (f) { var d = el('div', 'fact ' + f[0]); d.appendChild(el('b', null, f[1][0])); d.appendChild(list(f[1][1])); facts.appendChild(d); });
    hero.appendChild(facts);
    main.appendChild(hero);

    var toc = el('nav', 'toc'); toc.setAttribute('aria-label', c.toc);
    c.sections.forEach(function (s) { var a = el('a', null, s.h.replace(/^\d+\.\s*/, '')); a.href = '#' + s.id; toc.appendChild(a); });
    var ca = el('a', null, c.checkTitle); ca.href = '#checkliste'; toc.appendChild(ca);
    main.appendChild(toc);

    c.sections.forEach(function (s) {
      var sec = el('section', 'guide'); sec.id = s.id;
      sec.appendChild(el('span', 'who', s.who));
      sec.appendChild(el('h2', null, s.h));
      sec.appendChild(el('p', 'intro', s.intro));
      var ul = el('ul', 'tips');
      s.tips.forEach(function (t) { var li = el('li'); li.appendChild(el('b', null, t[0])); li.appendChild(el('span', null, t[1])); ul.appendChild(li); });
      sec.appendChild(ul);
      if (s.ask) { var a = el('div', 'ask'); a.appendChild(el('b', null, s.ask[0])); a.appendChild(list(s.ask[1])); sec.appendChild(a); }
      if (s.callout) { var w = el('div', 'callout'); w.appendChild(el('b', null, s.callout[0])); w.appendChild(document.createTextNode(s.callout[1])); sec.appendChild(w); }
      main.appendChild(sec);
    });

    var chk = el('section', 'check'); chk.id = 'checkliste';
    chk.appendChild(el('h2', null, c.checkTitle)); chk.appendChild(list(c.check)); main.appendChild(chk);

    var em = el('div', 'emergency');
    c.emergency.forEach(function (e) { var d = el('div'); d.appendChild(el('strong', null, e[0])); d.appendChild(el('span', null, e[1])); em.appendChild(d); });
    main.appendChild(em);
    main.appendChild(el('p', 'stamp', c.stamp)).style.marginTop = '20px';

    document.documentElement.lang = lang;
    var rtl = lang === 'ar';
    document.documentElement.dir = rtl ? 'rtl' : 'ltr';
    document.body.classList.toggle('rtl', rtl);
    document.querySelectorAll('.langs button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
    var ft = { de: ['Datenschutz', 'Nutzungsbedingungen'], en: ['Privacy', 'Terms'], tr: ['Gizlilik', 'Kullanım şartları'], ar: ['الخصوصية', 'شروط الاستخدام'] }[lang];
    document.getElementById('ft-privacy').textContent = ft[0]; document.getElementById('ft-terms').textContent = ft[1];
    try { localStorage.setItem('helpado_landing_lang', lang); } catch (e) {}
  }
  document.querySelectorAll('.langs button').forEach(function (b) { b.addEventListener('click', function () { render(b.getAttribute('data-lang')); }); });
  var saved = null; try { saved = localStorage.getItem('helpado_landing_lang'); } catch (e) {}
  render(saved && C[saved] ? saved : 'de');
})();
</script>
