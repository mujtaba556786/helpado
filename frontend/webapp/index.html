    <!-- App stylesheet — bump ?v= whenever style.css changes to bust browser cache -->

    <!-- Cache-bust helphub app JS modules — SAP UI5 loads controller/mixin files via
         <script> tags, so we intercept the HTMLScriptElement src setter before UI5
         boots. Bump _HH_BUILD whenever JS files change to force a fresh fetch. -->
    <script>
        (function () {
            var _HH_BUILD = '3.09';
            var _desc = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src');
            Object.defineProperty(HTMLScriptElement.prototype, 'src', {
                get: _desc.get,
                set: function (val) {
                    if (typeof val === 'string' && val.indexOf('?') === -1 &&
                        (val.indexOf('/controller/') !== -1 ||
                         val.indexOf('/model/')      !== -1 ||
                         val.indexOf('Component.js') !== -1)) {
                        val = val + '?v=' + _HH_BUILD;
                    }
                    _desc.set.call(this, val);
                },
                configurable: true
            });

            // Bust XHR + fetch for all app JS/XML/i18n files
            var _HH_RE = /\/(controller|model|view|fragments|Base|i18n)\//;
            var _origOpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method, url) {
                if (typeof url === 'string' && url.indexOf('?') === -1 &&
                    (_HH_RE.test(url) || url.indexOf('Component.js') !== -1)) {
                    url = url + '?v=' + _HH_BUILD;
                }
                return _origOpen.apply(this, arguments);
            };
            var _origFetch = window.fetch;
            window.fetch = function(input, init) {
                if (typeof input === 'string' && input.indexOf('?') === -1 &&
                    (_HH_RE.test(input) || input.indexOf('Component.js') !== -1)) {
                    input = input + '?v=' + _HH_BUILD;
                }
                return _origFetch.call(this, input, init);
            };
        })();
    </script>

    <!-- Apply saved language before UI5 boots (also activates RTL for Arabic) -->
    <script>
        window['sap-ui-config'] = {
            language: localStorage.getItem('helpmate_lang') || ''
        };
    </script>
    <script>
        (function () {
            // Mobile (Cordova) ships a self-contained bundle (sap-ui-custom.js)
            // built via `ui5 build self-contained`. Booting from sap-ui-core.js
            // triggers fragile module-by-module loading that stalls in the
            // WebView (white screen). sap-ui-custom.js is one file with the whole
            // framework + app Component. On the web there is no sap-ui-custom.js,
            // so the HEAD check 404s and we fall back to the CDN below.
            var local = 'resources/sap-ui-custom.js';
            var cdn   = 'https://ui5.sap.com/1.120/resources/sap-ui-core.js';
            var src   = cdn;
            try {
                var x = new XMLHttpRequest();
                x.open('HEAD', local, false);
                x.send();
                if (x.status === 200) src = local;
            } catch (e) {}
            var s = document.createElement('script');
            s.id = 'sap-ui-bootstrap';
            s.setAttribute('data-sap-ui-theme', 'helpmate');
            s.setAttribute('data-sap-ui-theme-roots', '{"helpmate":"./themes/"}');
            s.setAttribute('data-sap-ui-resource-roots', '{"helphub":""}');
            s.setAttribute('data-sap-ui-on-init', 'module:sap/ui/core/ComponentSupport');
            s.setAttribute('data-sap-ui-compat-version', 'edge');
            s.setAttribute('data-sap-ui-async', 'true');
            s.setAttribute('data-sap-ui-frame-options', 'trusted');
            s.src = src;
            document.head.appendChild(s);
        })();
    </script>
