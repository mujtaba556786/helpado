# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: helphub
type: application
framework:
  name: OpenUI5
  version: "1.120.18"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.ui.unified
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
          # Pinned to the version the app actually ships with (framework.version
          # above; the APK bundles the same one and index.html pins CDN 1.120).
          # Without this the proxy serves whatever ui5.sap.com's latest is, so the
          # OPA5/QUnit suites were running on 1.147 while users got 1.120 — the
          # Popover arrow bug shipped green because of exactly that gap.
          version: 1.120.18
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
