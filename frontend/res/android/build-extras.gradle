// Copied into platforms/android/app/ by `npm run cordova:prepare`.
//
// Since Kotlin 1.8 the kotlin-stdlib artifact absorbed kotlin-stdlib-jdk7 and
// kotlin-stdlib-jdk8. Firebase/push pulls stdlib 1.8.22 while another transitive
// dependency still asks for the jdk7/jdk8 artifacts at 1.7.21, so the same
// classes arrive twice and :app:checkDebugDuplicateClasses fails the build.
// Dropping the two legacy artifacts leaves one copy of each class.
//
// This lives in res/android/ rather than platforms/, because platforms/ is
// regenerated by `cordova platform add` and is not tracked in git.
allprojects {
    configurations.configureEach {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}
